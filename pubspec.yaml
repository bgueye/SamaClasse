name: samaclasse
description: "SamaClasse : le programme scolaire du Sénégal, leçons et exercices."
publish_to: none
version: 0.2.0+2

environment:
  sdk: ^3.8.0
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # v2 avec publishableKey, pour faciliter le passage à la v3
  # (encore en préversion 3.0.0-dev au 13/11/2026).
  supabase_flutter: ^2.17.1
  go_router: ^17.0.0
  flutter_markdown_plus: ^1.0.7
  shared_preferences: ^2.5.3
  # Ouvre l'artefact d'une leçon dans le navigateur (écran « Validation »,
  # décision D26). Paquet officiel de l'équipe Flutter.
  url_launcher: ^6.3.3
  image_picker: ^1.2.4
  image: ^4.13.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Génèrent l'icône et l'écran de lancement (décision D19) à partir de
  # assets/icone/ ; outils de développement, rien n'est ajouté à l'application.
  # Configuration : flutter_launcher_icons.yaml et flutter_native_splash.yaml.
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/licences/

  # Polices embarquées (pas de téléchargement au lancement : utile hors connexion).
  # Instances statiques tirées des polices variables de Google Fonts (licence OFL).
  fonts:
    - family: AtkinsonHyperlegibleNext
      fonts:
        - asset: assets/fonts/AtkinsonHyperlegibleNext-Regular.ttf
        - asset: assets/fonts/AtkinsonHyperlegibleNext-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/AtkinsonHyperlegibleNext-Bold.ttf
          weight: 700
    - family: PlaywriteFRModerne
      fonts:
        - asset: assets/fonts/PlaywriteFRModerne-Regular.ttf
    # Polices de secours (décision D17) : exposants, flèches, grec, symboles
    # mathématiques et phonétiques absents des deux polices ci-dessus.
    # Sous-ensembles de Noto Sans et Noto Sans Math (OFL), fabriqués par
    # tool/polices/sous_ensembles.py. Utilisées seulement pour ces caractères.
    - family: NotoSansSecours
      fonts:
        - asset: assets/fonts/NotoSansSecours-Regular.ttf
    - family: NotoSansMathSecours
      fonts:
        - asset: assets/fonts/NotoSansMathSecours-Regular.ttf
